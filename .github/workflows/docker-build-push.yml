name: Docker Build and Push

# Run this workflow only when code is pushed to week02
on:
  push:
    branches: [week02]

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub provides a fresh Linux VM for each run

    steps:
      # 1. Download the repo code into the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Enable Buildx (Docker's advanced builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub using the secrets (never hardcode them)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build the image, attach labels, and push with two tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .   # folder containing the Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}
